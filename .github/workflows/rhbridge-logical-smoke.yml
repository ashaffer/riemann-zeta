name: RHBridge logical smoke checks

on:
  push:
    branches:
      - codex/formal-trust-boundary
    paths:
      - ".github/workflows/rhbridge-logical-smoke.yml"
      - "lean/rhbridge/RHBridge/IntervalAutocorrelationSupport.lean"
      - "lean/rhbridge/RHBridge/RelativeFactorObstruction.lean"
      - "lean/rhbridge/RHBridge/R176NecessaryCondition.lean"
      - "lean/rhbridge/RHBridge/FixedWindowStripReduction.lean"
      - "lean/rhbridge/RHBridge/LongMollifierStripReduction.lean"
      - "lean/rhbridge/RHBridge/HighOrderMollifierObstruction.lean"
      - "lean/rhbridge/RHBridge/HighOrderMollifierObstructionAudit.lean"
      - "lean/glide/Glide/P2Symbol.lean"
      - "src/long_mollifier_strip_gate.py"
      - "src/test_long_mollifier_strip_gate.py"
      - "src/high_order_mollifier_shift.py"
      - "src/test_high_order_mollifier_shift.py"
      - "results/LONG-MOLLIFIER-ZERO-FREE-STRIP-SPRINT.md"
      - "results/HIGH-ORDER-MOLLIFIER-SHIFT-AUDIT.md"
  pull_request:
    paths:
      - ".github/workflows/rhbridge-logical-smoke.yml"
      - "lean/rhbridge/RHBridge/IntervalAutocorrelationSupport.lean"
      - "lean/rhbridge/RHBridge/RelativeFactorObstruction.lean"
      - "lean/rhbridge/RHBridge/R176NecessaryCondition.lean"
      - "lean/rhbridge/RHBridge/FixedWindowStripReduction.lean"
      - "lean/rhbridge/RHBridge/LongMollifierStripReduction.lean"
      - "lean/rhbridge/RHBridge/HighOrderMollifierObstruction.lean"
      - "lean/rhbridge/RHBridge/HighOrderMollifierObstructionAudit.lean"
      - "lean/glide/Glide/P2Symbol.lean"
      - "src/long_mollifier_strip_gate.py"
      - "src/test_long_mollifier_strip_gate.py"
      - "src/high_order_mollifier_shift.py"
      - "src/test_high_order_mollifier_shift.py"
      - "results/LONG-MOLLIFIER-ZERO-FREE-STRIP-SPRINT.md"
      - "results/HIGH-ORDER-MOLLIFIER-SHIFT-AUDIT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhbridge-logical-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Test zero-free-strip exponent ledgers
        run: >-
          PYTHONPATH=src python3 -m unittest -v
          src/test_long_mollifier_strip_gate.py
          src/test_high_order_mollifier_shift.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/rhbridge
          build-args: >-
            RHBridge.IntervalAutocorrelationSupport
            RHBridge.RelativeFactorObstruction
            RHBridge.R176NecessaryCondition
            RHBridge.FixedWindowStripReduction
            RHBridge.LongMollifierStripReduction
            RHBridge.HighOrderMollifierObstructionAudit
            Glide.P2Symbol
          test: false
          lint: false
          use-mathlib-cache: true
