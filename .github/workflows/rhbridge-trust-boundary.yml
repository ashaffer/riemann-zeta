name: RHBridge trust-boundary checks

on:
  push:
    branches:
      - codex/formal-trust-boundary
    paths:
      - ".github/workflows/rhbridge-trust-boundary.yml"
      - "lean/rhbridge/**"
      - "lean/glide/**"
  pull_request:
    paths:
      - ".github/workflows/rhbridge-trust-boundary.yml"
      - "lean/rhbridge/**"
      - "lean/glide/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhbridge-trust-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logical-trust-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/rhbridge
          build-args: >-
            RHBridge.IntervalAutocorrelationSupport
            RHBridge.ActivationCancellationAudit
            RHBridge.RelativeFactorObstruction
            RHBridge.R176NecessaryCondition
            RHBridge.FixedWindowStripReduction
            Glide.P2Symbol
          test: false
          lint: false
          use-mathlib-cache: true
