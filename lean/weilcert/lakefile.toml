name = "weilcert"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Weilcert"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "Weilcert"

[[lean_lib]]
name = "WeilcertDeep"

[[lean_lib]]
name = "WeilcertFamily"

[[lean_lib]]
name = "WeilcertDeeper"

[[lean_lib]]
name = "BridgeLegendre"

[[lean_lib]]
name = "BridgeOverlap"

[[lean_lib]]
name = "CertFramework"

[[lean_lib]]
name = "CertInstance"

[[lean_lib]]
name = "CurveCertE5"

[[lean_lib]]
name = "FloorWitness"
