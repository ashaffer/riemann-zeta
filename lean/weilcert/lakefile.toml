name = "weilcert"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math"]
defaultTargets = ["Weilcert", "CertFramework", "FullInfTransfer", "FullInfExactLedgers", "LegendreTail", "LegendrePlaneWave", "LegendreRodrigues", "LegendreOrthogonality", "LegendreCoefficientTail", "LegendreScaled", "HilbertBasisTail", "LegendreL2", "LegendreIntervalL2", "LegendreScaledL2", "LegendreParityCoordinates", "LegendrePlaneWaveL2", "IntervalFourierL2", "IntervalZeroExtension", "LegendrePlaneWaveBand", "FullInfLegendreLedger", "FullInfFourierBridge", "PoleProjectionL2", "FullInfAnalyticLedger", "FullInfOperatorLedger", "BandOperatorBilinear", "BoundedSymbolMultiplier", "SymbolQuadraticComparison", "FullInfP2Endpoint", "FullInfP2CanonicalEndpoint", "FullInfClipped48", "FullInfClipped48Real", "FullInfClipped48Transfer"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

